[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "warpSPHBoundaries"
version = "0.1.0"
description = "Exact SPH boundary integrals via divergence-theorem edge reductions (2D), scene layer and delta+-SPH / DFSPH solvers on analytic boundaries"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["sph", "smoothed-particle-hydrodynamics", "boundary-conditions", "warp", "pytorch", "analytic-boundaries"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy", "scipy", "mpmath", "torch", "warp-lang", "warpSPHCore>=0.6.0"]

[project.optional-dependencies]
# the solvers (`sim/`: delta+-SPH and DFSPH on analytic boundaries) run on warpSPH; warpSPH in turn uses this package for `--wallRepresentation analytic` (its `boundaries` extra)
solvers = ["warpSPH>=0.6.0", "warpSPHCore>=0.6.0"]
scripts = ["matplotlib"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/wi-re/warpSPHBoundaries"
Issues = "https://github.com/wi-re/warpSPHBoundaries/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["warpSPHBoundaries*"]

[tool.setuptools.package-data]
warpSPHBoundaries = ["data/tables/*.npz", "data/symbolic/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds / installs / long runs; deselect with -m \"not slow\""]
